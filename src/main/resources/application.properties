# =====================================================
# CONFIGURACIÓN DE LA BASE DE DATOS H2 (EN DISCO)
# =====================================================

# URL de conexión a la base de datos H2.
# Se guarda en un fichero dentro de la carpeta del proyecto.
# Los datos se mantienen aunque se reinicie la aplicación.
spring.datasource.url=jdbc:h2:file:./data/tpv;DB_CLOSE_ON_EXIT=FALSE

# Usuario de la base de datos (por defecto en H2 es "sa")
spring.datasource.username=sa

# Contraseña de la base de datos (vacía por defecto en H2)
spring.datasource.password=


# =====================================================
# CONSOLA WEB DE H2
# =====================================================

# Activa la consola web de H2
spring.h2.console.enabled=true

# Ruta donde estará disponible la consola
# http://localhost:8080/h2-console
spring.h2.console.path=/h2-console


# =====================================================
# CONFIGURACIÓN JPA / HIBERNATE
# =====================================================

# update:
# - Crea las tablas la primera vez
# - Aplica cambios de estructura sin borrar datos
# Los datos se conservan entre reinicios
spring.jpa.hibernate.ddl-auto=update

# Muestra las sentencias SQL que ejecuta Hibernate
spring.jpa.show-sql=true

# Permite retrasar la inicialización de la base de datos
spring.jpa.defer-datasource-initialization=true


# =====================================================
# CONFIGURACIÓN DEL SERVIDOR
# =====================================================

# Nombre de la aplicación
spring.application.name=tpv

# Puerto donde se ejecuta la aplicación
server.port=8080

# Desactivar caché de Thymeleaf para que los cambios se reflejen de inmediato
spring.thymeleaf.cache=false