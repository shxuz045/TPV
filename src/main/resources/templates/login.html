<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout :: layout(~{::content})}">

<body>
    <main th:fragment="content">

        <div class="auth-container">
            <div class="auth-card">
                <h2 class="auth-title">Iniciar sesión</h2>

                <div th:if="${param.error}" class="auth-alert auth-alert--error">
                    Usuario o contraseña incorrectos.
                </div>
                <div th:if="${param.logout}" class="auth-alert auth-alert--success">
                    Has cerrado sesión correctamente.
                </div>

                <form th:action="@{/login}" method="post" class="auth-form">
                    <div class="form-group">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" id="username" name="username" class="form-control"
                            placeholder="Introduce tu usuario (admin o cajero)" required autofocus />
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Introduce tu contraseña" required />
                    </div>
                    <button type="submit" class="btn btn--primary btn--full">Entrar</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
