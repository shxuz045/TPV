<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout :: layout(~{::content})}">

<body>
    <main th:fragment="content">
        <!-- Navegación de Servicio -->
        <nav class="service-nav">
            <a th:href="@{/sala}" class="service-nav__btn">SALA</a>
            <a th:href="@{/recogida}" class="service-nav__btn">RECOGIDA</a>
            <span class="service-nav__btn service-nav__btn--active">DOMICILIO</span>
        </nav>

        <div class="domicilio-panel-simple">
            <!-- Barra superior centrada: Nuevo Pedido -->
            <div class="domicilio-top-bar">
                <button type="button" class="btn-nuevo-domicilio-grande" id="btn-abrir-modal-nuevo">
                    + NUEVO PEDIDO A DOMICILIO
                </button>
            </div>

            <!-- Avisos flash generales -->
            <div th:if="${mensajeOk}" class="domicilio-alert domicilio-alert--ok" th:text="${mensajeOk}"></div>
            <div th:if="${mensajeError}" class="domicilio-alert domicilio-alert--error" th:text="${mensajeError}"></div>

            <!-- Pedidos activos -->
            <div class="domicilio-pedidos-seccion">
                <div class="domicilio-grid-pedidos">
                    <div th:each="p : ${pedidosActivos}" class="pedido-domicilio-card"
                        th:onclick="'window.location.href=\'' + @{/comanda(id=${p.id}, tipo='DOMICILIO')} + '\''"
                        title="Toca para entrar en la comanda y gestionar el cobro">
                        <!-- Cabecera de la ficha: Número asignado (90, 91...) y hora -->
                        <div class="pedido-head">
                            <span class="pedido-numero-sobrante" th:text="${p.mesa}">Domicilio 90</span>
                            <span class="pedido-hora-tag"
                                th:classappend="${p.horaEntregaProgramada != 'Al momento'} ? 'hora-tag--programada' : 'hora-tag--momento'">
                                <span th:text="${'⏰ ' + p.horaEntregaProgramada}">⏰ Al momento</span>
                            </span>
                        </div>

                        <!-- Datos del cliente y dirección de entrega -->
                        <div class="pedido-cuerpo">
                            <div class="pedido-nombre" th:text="${p.nombreCliente}">Cliente</div>
                            <div th:if="${p.telefonoCliente != null and !#strings.isEmpty(p.telefonoCliente)}"
                                class="pedido-telefono">
                                <span style="text-decoration:none; display:inline-block; margin-right:3px;">📞</span><a th:href="${'tel:' + p.telefonoCliente}" onclick="event.stopPropagation();"
                                    th:text="${p.telefonoCliente}" style="text-decoration:none;">600000000</a>
                            </div>
                            <div class="pedido-direccion" th:text="${'📍 ' + p.direccionCliente}">📍 Calle Mayor 12
                            </div>
                            <div th:if="${p.notasEntrega != null and !#strings.isEmpty(p.notasEntrega)}"
                                class="pedido-notas" th:text="${'💬 ' + p.notasEntrega}">Notas</div>
                        </div>

                        <!-- Resumen de artículos -->
                        <div class="pedido-articulos">
                            <div th:if="${#lists.isEmpty(p.lineas)}" class="articulos-vacio">
                                ⚠️ Sin platos añadidos todavía (pulsa para añadir)
                            </div>
                            <ul th:unless="${#lists.isEmpty(p.lineas)}" class="articulos-lista">
                                <li th:each="l : ${p.lineas}">
                                    <span class="art-cant" th:text="${l.cantidad + 'x'}">1x</span>
                                    <span class="art-nombre"
                                        th:text="${l.producto != null ? l.producto.nombre : 'Plato'}">Arroz</span>
                                    <span th:if="${l.notas != null and !#strings.isEmpty(l.notas) and !(l.producto != null and (#strings.containsIgnoreCase(l.producto.nombre, 'menú') or #strings.containsIgnoreCase(l.producto.nombre, 'menu') or (l.producto.categoria != null and (#strings.containsIgnoreCase(l.producto.categoria, 'menú') or #strings.containsIgnoreCase(l.producto.categoria, 'menu'))))) and !#strings.contains(l.notas, '1º:') and !#strings.contains(l.notas, 'Elección:') and !#strings.contains(l.notas, 'Eleccion:')}" class="art-nota"
                                        th:text="${'(' + l.notas + ')'}"></span>
                                </li>
                            </ul>
                        </div>

                        <!-- Total -->
                        <div class="pedido-pie">
                            <div class="pedido-total-box">
                                <span class="lbl-total">Total:</span>
                                <span class="val-total" th:text="${#numbers.formatDecimal(p.total, 1, 2) + ' €'}">0.00 €</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        </div>

        <!-- ========================================================
             POP-UP / NOTIFICACIÓN: PEDIDO CANCELADO
             ======================================================== -->
        <div id="popup-cancelado" class="modal-overlay" th:if="${pedidoCanceladoMesa != null}" style="display: flex;">
            <div class="modal-box modal-box--noti">
                <div class="noti-icono">✕</div>
                <h3 class="noti-titulo">Pedido Cancelado</h3>
                <p class="noti-mensaje" th:text="${'El ' + pedidoCanceladoMesa + ' ha sido cancelado con éxito.'}">
                    Pedido cancelado.</p>
                <div class="noti-pie">
                    <button type="button" class="btn-modal btn-modal--confirmar"
                        onclick="cerrarModal('popup-cancelado')">Aceptar</button>
                </div>
            </div>
        </div>

        <!-- ========================================================
             MODAL: NUEVO PEDIDO A DOMICILIO
             ======================================================== -->
        <div id="modal-nuevo-pedido" class="modal-overlay">
            <div class="modal-box modal-box--domicilio">
                <div class="modal-header">
                    <h2 class="modal-titulo">Nuevo Pedido a Domicilio</h2>
                    <button type="button" class="modal-cerrar-x" onclick="cerrarModal('modal-nuevo-pedido')">✕</button>
                </div>

                <!-- BUSCADOR DE TELÉFONO -->
                <div class="form-grupo">
                    <label class="form-etiqueta" for="input-telefono">📞 Teléfono del cliente (9 dígitos) *</label>
                    <div class="tel-input-wrapper">
                        <input type="tel" name="telefono" id="input-telefono" class="form-input form-input--tel-grande"
                            required placeholder=" " inputmode="numeric" pattern="[0-9]{9}" maxlength="9"
                            oninput="onTelefonoInput()" autocomplete="off" />
                        <button type="button" class="btn-comprobar-tel" onclick="comprobarTelefonoActual()"
                            id="btn-buscar-tel" title="Buscar cliente">
                            🔍
                        </button>
                    </div>

                    <!-- Resultado búsqueda: cliente encontrado o no -->
                    <div id="tel-resultado" style="display:none; margin-top:10px;"></div>
                </div>

                <!-- FORMULARIO (oculto hasta conocer el teléfono) -->
                <form th:action="@{/domicilio/crear}" method="post" class="form-nuevo-domicilio" autocomplete="off"
                    id="form-nuevo-domicilio">
                    <input type="hidden" name="telefono" id="hidden-telefono" />
                    <input type="hidden" name="nombreCliente" id="hidden-nombre-cliente" />

                    <!-- Panel cliente encontrado: nombre + selección de direcciones -->
                    <div id="panel-cliente-existente" style="display:none;">
                        <div class="cliente-encontrado-header">
                            <span id="cliente-nombre-display" class="cliente-nombre-grande"></span>
                            <button type="button" class="btn-link-inline" onclick="editarNombreCliente()">✏️ editar
                                nombre</button>
                        </div>
                        <div id="input-nombre-edicion" style="display:none; margin-top:6px;" class="form-grupo">
                            <input type="text" id="input-nombre-cliente" class="form-input"
                                placeholder="Nombre del cliente" />
                        </div>

                        <div class="form-grupo" style="margin-top:14px;">
                            <label class="form-etiqueta">📍 Selecciona dirección de entrega:</label>
                            <div id="lista-direcciones-guardadas" class="direcciones-lista"></div>
                            <button type="button" class="btn-nueva-direccion" id="btn-nueva-dir"
                                onclick="mostrarInputNuevaDireccion()">
                                + Usar nueva dirección
                            </button>
                        </div>
                    </div>

                    <!-- Panel cliente nuevo -->
                    <div id="panel-cliente-nuevo" style="display:none;">
                        <div class="nuevo-cliente-aviso">
                            ℹ️ <strong>Cliente nuevo.</strong> Introduce sus datos:
                        </div>
                        <div class="form-grupo">
                            <label class="form-etiqueta" for="input-nombre-nuevo">Nombre (opcional)</label>
                            <input type="text" id="input-nombre-nuevo" class="form-input"
                                placeholder="Nombre del cliente" />
                        </div>
                    </div>

                    <!-- Campo dirección (siempre visible cuando el formulario está activo) -->
                    <div id="grupo-direccion" class="form-grupo" style="display:none;">
                        <label class="form-etiqueta" for="input-direccion-cliente">📍 Dirección de entrega *</label>
                        <input type="text" name="direccion" id="input-direccion-cliente" required class="form-input"
                            placeholder="Calle, número, piso..." />
                    </div>

                    <!-- Notas -->
                    <div id="grupo-notas" class="form-grupo" style="display:none;">
                        <label class="form-etiqueta" for="input-notas-cliente">💬 Notas de entrega (opcional)</label>
                        <input type="text" name="notasEntrega" id="input-notas-cliente" class="form-input"
                            placeholder="Timbre roto, dejar en puerta..." />
                    </div>

                    <!-- Horario -->
                    <div id="grupo-horario" class="form-grupo" style="display:none;">
                        <label class="form-etiqueta">Horario de entrega:</label>
                        <div class="selector-horario-grupo">
                            <label class="selector-horario-btn">
                                <input type="radio" name="tipoHorario" value="momento" checked
                                    onchange="toggleHorario(false)" />
                                <span>⚡ Para ahora (Inmediato)</span>
                            </label>
                            <label class="selector-horario-btn">
                                <input type="radio" name="tipoHorario" value="programado"
                                    onchange="toggleHorario(true)" />
                                <span>📅 Programar hora</span>
                            </label>
                        </div>
                        <input type="time" id="input-hora-programada" name="horaProgramada"
                            class="form-input form-input--hora" style="display: none; margin-top: 8px;"
                            min="00:00" max="23:59" step="300" />
                    </div>

                    <div class="modal-footer" id="footer-form" style="display:none;">
                        <button type="button" class="btn-modal btn-modal--cancelar"
                            onclick="cerrarModal('modal-nuevo-pedido')">Cancelar</button>
                        <button type="submit" class="btn-modal btn-modal--confirmar">Continuar y Añadir Platos
                            →</button>
                    </div>
                </form>

                <!-- Footer mientras solo está el buscador -->
                <div class="modal-footer" id="footer-solo-buscar">
                    <button type="button" class="btn-modal btn-modal--cancelar"
                        onclick="cerrarModal('modal-nuevo-pedido')">Cancelar</button>
                </div>
            </div>
        </div>

        <!-- Scripts interactivos de la vista -->
        <script>
            let telDebounceTimer = null;
            let ultimoTelComprobado = '';
            let clienteActual = null; // datos del cliente encontrado

            document.addEventListener('DOMContentLoaded', function () {
                const btnNuevo = document.getElementById('btn-abrir-modal-nuevo');
                if (btnNuevo) {
                    btnNuevo.addEventListener('click', function () {
                        abrirModal('modal-nuevo-pedido');
                    });
                }
                const popupCancelado = document.getElementById('popup-cancelado');
                if (popupCancelado) {
                    setTimeout(function () { popupCancelado.style.display = 'none'; }, 4000);
                }
            });

            function abrirModal(id) {
                const m = document.getElementById(id);
                if (m) {
                    m.style.display = 'flex';
                    if (id === 'modal-nuevo-pedido') {
                        resetearFormularioDomicilio();
                        const tel = document.getElementById('input-telefono');
                        if (tel) setTimeout(function () { tel.focus(); }, 100);
                    }
                }
            }

            function cerrarModal(id) {
                const m = document.getElementById(id);
                if (m) m.style.display = 'none';
                if (id === 'modal-nuevo-pedido') {
                    resetearFormularioDomicilio();
                }
            }

            function resetearFormularioDomicilio() {
                ultimoTelComprobado = '';
                clienteActual = null;
                const telInput = document.getElementById('input-telefono');
                if (telInput) telInput.value = '';
                ocultarTodo();
            }

            function ocultarTodo() {
                ['tel-resultado', 'panel-cliente-existente', 'panel-cliente-nuevo',
                    'grupo-direccion', 'grupo-notas', 'grupo-horario', 'footer-form'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.style.display = 'none';
                    });
                const footerBuscar = document.getElementById('footer-solo-buscar');
                if (footerBuscar) footerBuscar.style.display = 'flex';
            }

            function mostrarFormularioCompleto() {
                ['grupo-direccion', 'grupo-notas', 'grupo-horario', 'footer-form'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'block';
                });
                const footerBuscar = document.getElementById('footer-solo-buscar');
                if (footerBuscar) footerBuscar.style.display = 'none';
            }

            function onTelefonoInput() {
                const input = document.getElementById('input-telefono');
                if (!input) return;
                // Solo números del 0 al 9, nada de negativos, ni signos, ni espacios, máximo 9 caracteres
                input.value = input.value.replace(/[^0-9]/g, '').slice(0, 9);
                const digitos = input.value;

                clearTimeout(telDebounceTimer);
                if (digitos.length < 9) {
                    ocultarTodo();
                    ultimoTelComprobado = '';
                    return;
                }
                // Al alcanzar exactamente los 9 dígitos, se comprueba automáticamente
                if (digitos.length === 9) {
                    telDebounceTimer = setTimeout(function () { comprobarTelefonoActual(); }, 150);
                }
            }

            function comprobarTelefonoActual() {
                const input = document.getElementById('input-telefono');
                if (!input) return;
                input.value = input.value.replace(/[^0-9]/g, '').slice(0, 9);
                const telefono = input.value.trim();
                if (telefono.length !== 9) {
                    window.mostrarAlerta('El teléfono debe tener exactamente 9 dígitos numéricos (sin signos negativos ni letras).', 'Teléfono incorrecto', function () {
                        if (input) input.focus();
                    });
                    return;
                }
                if (telefono === ultimoTelComprobado) return;
                ultimoTelComprobado = telefono;

                fetch('/domicilio/verificar-telefono?telefono=' + encodeURIComponent(telefono))
                    .then(res => res.json())
                    .then(data => mostrarResultadoBusqueda(data, telefono))
                    .catch(err => console.error('Error al verificar teléfono:', err));
            }

            function mostrarResultadoBusqueda(data, telefono) {
                // Ocultar todo primero
                ['panel-cliente-existente', 'panel-cliente-nuevo', 'grupo-direccion', 'grupo-notas', 'grupo-horario', 'footer-form'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });

                // Poner el teléfono en el hidden
                const hiddenTel = document.getElementById('hidden-telefono');
                if (hiddenTel) hiddenTel.value = telefono;

                const footerBuscar = document.getElementById('footer-solo-buscar');
                if (footerBuscar) footerBuscar.style.display = 'none';

                if (data && data.encontrado) {
                    clienteActual = data;
                    mostrarClienteEncontrado(data);
                } else {
                    clienteActual = null;
                    mostrarClienteNuevo();
                }
            }

            function mostrarClienteEncontrado(data) {
                // Limpiar comas duplicadas si existieran por envíos anteriores
                let nombreLimpio = (data.nombre || '').trim();
                if (nombreLimpio.includes(',')) {
                    nombreLimpio = nombreLimpio.split(',')[0].trim();
                }
                data.nombre = nombreLimpio;

                // Mostrar nombre
                const nombreDisplay = document.getElementById('cliente-nombre-display');
                if (nombreDisplay) nombreDisplay.textContent = nombreLimpio || ('📞 ' + data.telefono);

                // Input nombre oculto pero con valor
                const inputNombre = document.getElementById('input-nombre-cliente');
                if (inputNombre) inputNombre.value = nombreLimpio || '';

                // Renderizar lista de direcciones
                const listaDirs = document.getElementById('lista-direcciones-guardadas');
                if (listaDirs) {
                    listaDirs.innerHTML = '';
                    const dirs = data.direcciones || (data.direccion ? [data.direccion] : []);
                    dirs.forEach((dir, idx) => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn-dir-guardada' + (idx === 0 ? ' btn-dir-guardada--activa' : '');
                        btn.innerHTML = '<span class="dir-texto">' + escapeHtml(dir) + '</span>'
                            + '<span class="dir-delete" onclick="eliminarDireccionGuardada(event, \'' + escapeHtml(dir).replace(/'/g, "\\'") + '\')">🗑</span>';
                        btn.addEventListener('click', function () {
                            seleccionarDireccion(dir);
                            listaDirs.querySelectorAll('.btn-dir-guardada').forEach(b => b.classList.remove('btn-dir-guardada--activa'));
                            btn.classList.add('btn-dir-guardada--activa');
                        });
                        listaDirs.appendChild(btn);
                    });
                    // Auto-seleccionar la primera
                    if (dirs.length > 0) seleccionarDireccion(dirs[0]);
                }

                // Ocultar input nueva dirección
                const grupoDireccion = document.getElementById('grupo-direccion');
                if (grupoDireccion) grupoDireccion.style.display = 'none';

                // Mostrar panel existente
                const panelExistente = document.getElementById('panel-cliente-existente');
                if (panelExistente) panelExistente.style.display = 'block';

                mostrarFormularioCompleto();
                // Ocultar grupo dirección porque ya se seleccionó
                if (grupoDireccion) grupoDireccion.style.display = 'none';
            }

            function mostrarClienteNuevo() {
                const panelNuevo = document.getElementById('panel-cliente-nuevo');
                if (panelNuevo) panelNuevo.style.display = 'block';

                // Limpiar dirección
                const inputDir = document.getElementById('input-direccion-cliente');
                if (inputDir) inputDir.value = '';

                mostrarFormularioCompleto();
            }

            function seleccionarDireccion(dir) {
                const inputDir = document.getElementById('input-direccion-cliente');
                if (inputDir) {
                    inputDir.value = dir;
                    // Ocultar el input de dirección cuando ya hay una seleccionada
                    const grupoDireccion = document.getElementById('grupo-direccion');
                    if (grupoDireccion) grupoDireccion.style.display = 'none';
                }
            }

            function mostrarInputNuevaDireccion() {
                const grupoDireccion = document.getElementById('grupo-direccion');
                if (grupoDireccion) {
                    grupoDireccion.style.display = 'block';
                    const inputDir = document.getElementById('input-direccion-cliente');
                    if (inputDir) {
                        inputDir.value = '';
                        inputDir.focus();
                    }
                }
                // Desmarcar direcciones guardadas
                const listaDirs = document.getElementById('lista-direcciones-guardadas');
                if (listaDirs) {
                    listaDirs.querySelectorAll('.btn-dir-guardada').forEach(b => b.classList.remove('btn-dir-guardada--activa'));
                }
            }

            function editarNombreCliente() {
                const panelEdicion = document.getElementById('input-nombre-edicion');
                if (panelEdicion) {
                    panelEdicion.style.display = panelEdicion.style.display === 'none' ? 'block' : 'none';
                    const inp = document.getElementById('input-nombre-cliente');
                    if (inp) inp.focus();
                }
            }

            function eliminarDireccionGuardada(e, direccion) {
                e.stopPropagation();
                const telInput = document.getElementById('input-telefono');
                const telefono = telInput ? telInput.value.trim() : '';

                window.mostrarConfirmacion('¿Eliminar esta dirección guardada?\n"' + direccion + '"', function () {
                    fetch('/domicilio/cliente/eliminar-direccion', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'telefono=' + encodeURIComponent(telefono) + '&direccion=' + encodeURIComponent(direccion)
                    })
                        .then(res => res.json())
                        .then(data => {
                            if (data.ok) {
                                const nuevoData = { encontrado: true, nombre: clienteActual ? clienteActual.nombre : '', telefono: telefono, direcciones: data.direcciones };
                                clienteActual = nuevoData;
                                mostrarClienteEncontrado(nuevoData);
                            }
                        });
                }, null, { peligroso: true, titulo: '¿Eliminar dirección?' });
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function toggleHorario(esProgramado) {
                const inp = document.getElementById('input-hora-programada');
                if (inp) {
                    inp.style.display = esProgramado ? 'block' : 'none';
                    if (esProgramado) inp.focus();
                }
            }

            // Validación del formulario antes de enviar y bloqueo de teclas no numéricas
            document.addEventListener('DOMContentLoaded', function () {
                const telInput = document.getElementById('input-telefono');
                if (telInput) {
                    // Impedir teclear signos negativos (-), +, espacios o letras
                    telInput.addEventListener('keydown', function (e) {
                        if (['Backspace', 'Tab', 'Delete', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'Enter'].includes(e.key)) return;
                        if (e.ctrlKey || e.metaKey) return;
                        if (!/^[0-9]$/.test(e.key)) {
                            e.preventDefault();
                        }
                    });
                }

                const form = document.getElementById('form-nuevo-domicilio');
                if (form) {
                    form.addEventListener('submit', function (e) {
                        const inputTelefono = document.getElementById('input-telefono');
                        const hiddenTel = document.getElementById('hidden-telefono');
                        const telVal = (inputTelefono ? inputTelefono.value : (hiddenTel ? hiddenTel.value : '')).replace(/[^0-9]/g, '');

                        if (telVal.length !== 9) {
                            e.preventDefault();
                            window.mostrarAlerta('El teléfono debe contener exactamente 9 números positivos.', 'Teléfono incorrecto', function () {
                                if (inputTelefono) inputTelefono.focus();
                            });
                            return;
                        }

                        if (hiddenTel) hiddenTel.value = telVal;

                        const inputDir = document.getElementById('input-direccion-cliente');
                        const dir = inputDir ? inputDir.value.trim() : '';
                        if (!dir) {
                            e.preventDefault();
                            window.mostrarAlerta('Selecciona o escribe una dirección de entrega.', 'Dirección requerida', function () {
                                if (inputDir) {
                                    const grupoDireccion = document.getElementById('grupo-direccion');
                                    if (grupoDireccion) grupoDireccion.style.display = 'block';
                                    inputDir.focus();
                                }
                            });
                            return;
                        }
                        // Validar hora si es programado
                        const radiosHorario = document.getElementsByName('tipoHorario');
                        let tipoHorario = 'momento';
                        radiosHorario.forEach(r => { if (r.checked) tipoHorario = r.value; });
                        if (tipoHorario === 'programado') {
                            const inpHora = document.getElementById('input-hora-programada');
                            if (!inpHora || !inpHora.value) {
                                e.preventDefault();
                                window.mostrarAlerta('Debes indicar una hora de entrega.', 'Hora requerida');
                                if (inpHora) inpHora.focus();
                                return;
                            }
                        }
                        // Determinar y asignar el nombre del cliente al campo hidden único
                        const hiddenNombre = document.getElementById('hidden-nombre-cliente');
                        let nombreFinal = '';

                        const panelNuevo = document.getElementById('panel-cliente-nuevo');
                        if (panelNuevo && panelNuevo.style.display !== 'none') {
                            const inputNombreNuevo = document.getElementById('input-nombre-nuevo');
                            nombreFinal = inputNombreNuevo ? inputNombreNuevo.value.trim() : '';
                        } else {
                            const inputNombreCliente = document.getElementById('input-nombre-cliente');
                            if (inputNombreCliente && inputNombreCliente.value.trim()) {
                                nombreFinal = inputNombreCliente.value.trim();
                            } else if (clienteActual && clienteActual.nombre) {
                                nombreFinal = clienteActual.nombre.trim();
                            }
                        }

                        // Asegurar que no contenga comas duplicadas
                        if (nombreFinal.includes(',')) {
                            nombreFinal = nombreFinal.split(',')[0].trim();
                        }

                        if (hiddenNombre) hiddenNombre.value = nombreFinal;
                    });
                }
            });
        </script>
    </main>
</body>

</html>
